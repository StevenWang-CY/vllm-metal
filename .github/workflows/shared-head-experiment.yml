name: Shared-head window experiment
on:
  push:
    branches: [validation/window-shared-heads]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      VLLM_METAL_BUILD_FROM_SOURCE: "0"
      MLX_ENABLE_TF32: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and check prototype
        run: |
          set -euo pipefail
          source scripts/lib.sh
          setup_dev_env
          ./install.sh
          source .venv-vllm-metal/bin/activate
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -c 'import pytest; from vllm_metal.metal import get_ops; get_ops()._set_window_test_heads(2); raise SystemExit(pytest.main(["-q", "tests/test_spec_window_parity.py"]))'
          python .github/diagnostics/window_shared_head_probe.py
          python -c 'import json; from pathlib import Path; r=json.loads(Path(".github/diagnostics/window-shared-head-probe/results.json").read_text()); assert len(r)==24; assert all(x["checks"].get("2",{}).get("bitwise") is True for x in r)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-head-experiment
          retention-days: 7
          if-no-files-found: warn
          path: .github/diagnostics/window-shared-head-probe/
