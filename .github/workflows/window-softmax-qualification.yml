name: Window softmax qualification

on:
  push:
    branches: [validation/window-softmax-df1c35f]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      VLLM_METAL_BUILD_FROM_SOURCE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build and run standard CI
        run: scripts/test.sh
      - name: Record provenance
        run: |
          set -euo pipefail
          source .venv-vllm-metal/bin/activate
          python -c 'from vllm_metal import envs; assert not envs.VLLM_METAL_BUILD_FROM_SOURCE'
          git rev-parse HEAD > native-build-commit.txt
          git diff df1c35f129a8a0f64553af95899d39da2f239c71 -- vllm_metal tests > native-source-diff.txt
          test ! -s native-source-diff.txt
          shasum -a 256 vllm_metal/metal/*.metallib > native-library-checksums.txt
          xcodebuild -version > native-toolchain.txt
          python -m pip freeze > native-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: window-softmax-df1c35f
          retention-days: 7
          if-no-files-found: error
          path: |
            vllm_metal/metal/*.metallib
            vllm_metal/metal/*.metallib.sha256
            native-build-commit.txt
            native-library-checksums.txt
            native-toolchain.txt
            native-environment.txt
